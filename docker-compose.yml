version: '3.8'

services:
  db:
    image: postgres:15
    container_name: data_orchestrator_pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: data_orchestrator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: data_orchestrator_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@demo.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: always

  redis:
    image: redis:7-alpine
    container_name: data_orchestrator_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
